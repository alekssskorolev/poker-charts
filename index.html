 const wrap=$('mini-table');wrap.replaceChildren();const felt=document.createElement('div');felt.className='poker-table-felt';wrap.append(felt);const list=getPositionsList(),coords=state.tableMax===9?COORDS_9:COORDS_8;wrap.style.height=state.tableMax===9?'148px':'140px';
 for(let s=0;s<list.length;s++){const pos=positionAtSeat(s),hero=s===0,group=document.createElement('div');group.className='seat-group';group.dataset.seat=s;group.style.left=coords[s][0]+'%';group.style.top=coords[s][1]+'px';const before=list.indexOf(pos)<list.indexOf(state.pos),isSelected=state.opponentSeat===s;
 const b=makeButton(pos,'seat'+(hero?' hero-seat':'')+(s===state.dealerSeat?' has-btn':'')+(isSelected?(before?' has-raiser':' has-3bet'):''),()=>setDealer(s));b.dataset.control='dealer:'+s;b.setAttribute('aria-pressed',String(s===state.dealerSeat));b.setAttribute('aria-label',`Дилер на месте ${s+1}: ${pos}${hero?', ваше место':''}`);group.append(b);
 const bar=document.createElement('div');bar.className='seat-actions-bar';
 function addChip(text,kind,handler,control,label,active,enabled=true,reason=''){const chip=makeButton(text,'action-chip '+kind+(active?' active-chip':''),handler);chip.dataset.control=control;chip.setAttribute('aria-label',label);chip.setAttribute('aria-pressed',String(active));chip.disabled=!enabled;chip.title=reason||label;bar.append(chip);}
 if(!hero){if(before){addChip('Р','raise-chip',e=>setRaiser(s,e),'raiser:'+s,'Рейз от '+pos,isSelected&&['vs_raise','rejam'].includes(state.action));if(state.pos==='BB'&&pos==='SB'){const enabled=anyCoverage('vs_limp',pos);addChip('Л','limp-chip',e=>setLimp(s,e),'limp:'+s,'Лимп SB — защита BB',isSelected&&state.action==='vs_limp',enabled,enabled?'Показать BB против лимпа SB':'Нет источника лимпа для этого стека (начиная с 15 BB).');}}
 else if(state.pos!=='BB'){addChip('3Б','threebet-chip',e=>setThreeBetter(s,e),'threebet:'+s,'Обычный 3-бет от '+pos,isSelected&&state.action==='faced_3bet',state.stack!=='1-9','Обычный 3-бет после нашего опен-рейза');const eligibility=aiEligibility(s);addChip('AI','allin-chip',e=>setAllIn(s,e),'allin:'+s,'ALL-IN '+pos+' после нашего опен-рейза',isSelected&&state.action==='vs_rejam',eligibility.ok,eligibility.reason);}}
 else if(state.opponentSeat!==null&&['vs_raise','rejam'].includes(state.action)){const enabled=anyCoverage('rejam',opponent());addChip('РЕПУШ','hero-repush-chip',e=>setOurRepush(e),'hero-repush','Наш репуш против '+opponent(),state.action==='rejam',enabled,enabled?'Диапазон нашего репуша против опена':'Нет чарта нашего репуша для этого стека/оппонента.');}
 group.append(bar);wrap.append(group);
 }
}
function renderControls(){
 for(const max of[8,9]){const b=$('btn-'+max+'max');b.classList.toggle('active',state.tableMax===max);b.setAttribute('aria-pressed',String(state.tableMax===max));}
 for(const row of[0,1]){const stacks=$(row===0?'stack-row':'stack-row-deep');stacks.replaceChildren();for(const range of STACK_OPTIONS.filter(r=>r.row===row)){const b=makeButton(range.key,'btn'+(state.range===range.key?' active':''),()=>setStack(range.key));b.setAttribute('aria-pressed',String(state.range===range.key));b.title=`${range.loInc?'≥':'>'}${range.lo} BB${Number.isFinite(range.hi)?' и '+(range.hiInc?'≤':'<')+range.hi+' BB':''}`;stacks.append(b);}}
 const actions=$('action-row');actions.replaceChildren();$('spot-reset').replaceChildren();if(state.opponentSeat!==null){const choices=['vs_raise','rejam'].includes(state.action)?availableScenarios().filter(item=>['vs_raise','rejam'].includes(item.key)):[];for(const item of choices.length>1?choices:[]){const b=makeButton(item.label,'btn scenario-btn'+(state.action===item.key?' active':''),()=>setScenario(item.key));b.setAttribute('aria-pressed',String(state.action===item.key));actions.append(b);}(actions.children.length?actions:$('spot-reset')).append(makeButton('×','btn reset-spot',()=>{clearScenario();renderAll();}));}
 const conditionRow=$('sub-condition-row');conditionRow.replaceChildren();const parts=getConditionalOptions();conditionRow.hidden=!parts.length;
 if(parts.length){const label=document.createElement('span');label.className='condition-label';label.textContent='Уточните стек:';conditionRow.append(label);for(const part of parts){const b=makeButton(part.label,'btn condition-btn'+(state.condition===part.key?' active':''),()=>{state.condition=part.key;renderAll();});b.title=`${part.loInc?'≥':'>'}${part.lo} BB${Number.isFinite(part.hi)?' и '+(part.hiInc?'≤':'<')+part.hi+' BB':''}`;b.setAttribute('aria-pressed',String(state.condition===part.key));conditionRow.append(b);}}
 const variants=$('variant-row');variants.replaceChildren();const openNode=engineScenario()==='open'?rawSlot():null;variants.hidden=!openNode?.variants;
 if(openNode?.variants){const names={tight:'Тайтовый',good:'Хороший',good_mixed:'Хороший / микс',loose_passive:'Лузово-пассивный'};const label=document.createElement('span');label.className='condition-label';label.textContent='Вариант SB:';variants.append(label);for(const key of Object.keys(openNode.variants)){const b=makeButton(names[key]??key,'btn'+(state.variant===key?' active':''),()=>{state.variant=key;state.condition=null;renderAll();});b.setAttribute('aria-pressed',String(state.variant===key));variants.append(b);}}
 const hint=$('spot-hint');hint.hidden=true;hint.textContent=state.action==='faced_3bet'?'На 3-бет — план из опен-чарта, не отдельная подстройка под игрока.':state.action==='vs_rejam'?'Мы открылись; соперник репушит. Пороги колла — накопительные.':'Мы репушим против опен-рейза. Пороги ≤15/20/25/30 перенесены по согласованной логике.';
 $('action-panel').hidden=actions.children.length===0&&conditionRow.hidden&&variants.hidden;
}
function renderMatrixAndVerdict(){
 const selected=getActiveChart(),chart=selected.chart,matrix=$('matrix'),focused=document.activeElement?.dataset?.hand;matrix.replaceChildren();
 for(const hand of HANDS){const key=chart?getRawKeyForHand(hand,chart):null,entry=chart?.legend.find(e=>e.key===key),appearance=cellAppearance(hand,selected),cell=makeButton(hand,'cell'+(hand.length===2?' pair':'')+(state.hand===hand?' selected':'')+(appearance.mixed?' mixed-background':''),()=>setHand(hand));cell.dataset.hand=hand;cell.disabled=!chart;cell.setAttribute('aria-pressed',String(state.hand===hand));cell.setAttribute('aria-label',hand+(entry?' — '+entry.label:chart?' — вне диапазона':' — нет данных'));cell.style.background=appearance.background;cell.style.color=appearance.text;matrix.append(cell);}
 if(focused)matrix.querySelector(`[data-hand="${focused}"]`)?.focus({preventScroll:true});
 const dec=getSingleClearDecision(state.hand,selected),appearance=cellAppearance(state.hand,selected),overlay=$('empty-overlay');overlay.hidden=Boolean(chart);overlay.replaceChildren();if(!chart){const h=document.createElement('h3');h.textContent=dec.main;const p=document.createElement('p');p.textContent=dec.sub;overlay.append(h,p);}
 const banner=$('verdict-banner');banner.style.background=appearance.background;banner.style.color=appearance.text;banner.classList.toggle('mixed-background',appearance.mixed);banner.dataset.status=dec.status;$('verdict-hand').textContent=state.hand;$('verdict-main').textContent=dec.main;$('verdict-sub').textContent=dec.sub;
 const legend=$('legend');legend.replaceChildren();if(chart)for(const entry of [...new Map(chart.legend.map(e=>{const v=effectiveEntry(e);return[v.key+'|'+v.color,v];})).values()]){const item=document.createElement('div');item.className='legend-item';const swatch=document.createElement('span');swatch.className='swatch';swatch.style.background=entry.color;const text=document.createElement('span');text.textContent=entry.label;item.append(swatch,text);legend.append(item);}
 const source=$('source-note');source.textContent=`База: ${DATABASE.summary.uniqueCharts} чартов. ${sourceDescription(selected)}${appearance.mixed?'Двухцветная клетка: альтернативы без заданных частот. ':''}${dec.status==='needs_resolution'?'Исходник не задаёт однозначного решения.':''}`;
}
function renderAll(){const focus=document.activeElement?.dataset?.control;state.pos=heroPosition();if(state.opponentSeat!==null&&['vs_raise','rejam'].includes(state.action)&&!anyCoverage(state.action,opponent())){const alternative=state.action==='vs_raise'?'rejam':'vs_raise';if(anyCoverage(alternative,opponent())){state.action=alternative;state.condition=null;state.variant=null;}}const variants=engineScenario()==='open'?rawSlot()?.variants:null;if(variants&&!variants[state.variant])state.variant=variants.tight?'tight':Object.keys(variants)[0];renderMiniTable();renderControls();renderMatrixAndVerdict();if(focus)[...document.querySelectorAll('[data-control]')].find(el=>el.dataset.control===focus)?.focus({preventScroll:true});}
for(const max of[8,9])$('btn-'+max+'max').onclick=()=>setTableMax(max);
$('matrix').addEventListener('keydown',e=>{const dirs={ArrowLeft:[0,-1],ArrowRight:[0,1],ArrowUp:[-1,0],ArrowDown:[1,0]};if(!dirs[e.key])return;const cells=[...$('matrix').children],idx=cells.indexOf(e.target);if(idx<0)return;e.preventDefault();const[dr,dc]=dirs[e.key],r=Math.max(0,Math.min(12,Math.floor(idx/13)+dr)),c=Math.max(0,Math.min(12,idx%13+dc));cells[r*13+c]?.focus();});
renderAll();
</script></body></html>

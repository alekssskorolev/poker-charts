</main>

  if(route.status!=='ok') return route;
  let chart=db?.[position]?.[route.stackKey]?.[scenario];
  if(!chart) return {...route,status:'no_data'};
  if(scenario==='vs_raise') {
    if(!opponent) return {...route,status:'opponent_required'};
    chart=chart[opponent];
    if(!chart) return {...route,status:'no_data'};
  }
  if(chart.variants) {
    if(!variant) return {...route,status:'variant_required',variants:Object.keys(chart.variants)};
    chart=chart.variants[variant];
    if(!chart) return {...route,status:'invalid_variant'};
  }
  return {...route,status:'ok',chart};
}

 if(selected.external){
  const spec=selected.external;
  add(`Источник дополнения — jensbaagaard/poker-practice, MTT ${spec.anchor} BB, анте 1 BB по настройкам источника. Точность солверного расчёта независимо не подтверждена. Исходные чарты курса не изменены.`);
  add(spec.anchor===20?'Условия таблицы: опен 2 BB (SB — 3 BB), 3-бет — all-in. Колл означает колл опен-рейза, не чужого пуша.':'Условия таблицы: опен 2,3 BB (SB — 3,5 BB); 3-бет в позиции — 3× опен, без позиции — 4×; максимум 9 BB в позиции и 10 BB без позиции. Реакция на другой сайзинг может отличаться.');
